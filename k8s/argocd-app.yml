# ArgoCD Application manifest - applied by operator-k8s.yml automatically.
# You can also apply this manually: kubectl apply -f k8s/argocd-app.yml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netflix-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aneeq-Ahmed-Malik/DevSecOps-Project
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
